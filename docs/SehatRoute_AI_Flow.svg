  <text x="525" y="221.0" font-size="11" fill="#1e293b" font-weight="normal">• Road: Google/TPL Maps (T_transit)</text>
  <text x="525" y="235.85" font-size="11" fill="#1e293b" font-weight="normal">• Hospital: Punjab HISDU live</text>
